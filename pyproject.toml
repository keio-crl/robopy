[project]
name = "robopy"
version = "0.3.4"
description = "A Python library for controlling robots with Dynamixel and Feetech actuators and Intel RealSense cameras."
readme = "README.md"
authors = [{ name = "tetsugo", email = "tetsugou2002@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "blosc2>=3.8.0",
    "digit-interface>=0.2.1",
    "dynamixel-sdk>=3.7.31",
    "h5py>=3.15.1",
    "imageio>=2.37.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.3",
    "numpy>=1.26.0",
    "opencv-python>=4.10",
    "pyquaternion>=0.9.9",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "feetech-servo-sdk>=1.0.0",
    "tqdm>=4.67.1",
    "xarm-python-sdk>=1.17.0",
]

[project.optional-dependencies]
audio = ["pyaudio>=0.2.14"]
realsense = ["pyrealsense2>=2.54.2"]
spacemouse = ["pyspacemouse>=0.0.7"]
# Whole-body URDF model + differential IK.  "pin" is the official PyPI
# distribution of Pinocchio and "pin-pink" is the official distribution of Pink
# (https://github.com/stephane-caron/pink).  Do not substitute similarly named
# packages.  robopy imports these lazily, so the rest of the library keeps
# working without this extra installed.
kinematics = [
    "pin>=3.2.0",
    "pin-pink>=3.1.0",
    "qpsolvers>=4.3.2",
    "quadprog>=0.1.12",
]
# Re-exporting the CAD model to MJCF.  Only needed to *regenerate* the model:
# the exported MJCF is committed, so simulating the robot needs whatever the
# simulator itself brings.
sim = ["mujoco>=3.2"]
# RoboVerse / MetaSim is not on PyPI (it is installed from the RoboVerse
# checkout, which also pins Python < 3.13), so there is deliberately no
# `roboverse` extra: an extra naming `roboverse-metasim` made `uv lock` and
# `uv sync` fail for the whole project.  MetaSim finds robopy's content pack
# through the entry point below, so `pip install robopy` (plus the `sim`
# extra for MuJoCo) into the RoboVerse environment is the whole setup.

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.11",
    "pre-commit>=4.0.1",
    "codespell>=2.2.6",
    "types-pyserial>=3.5.0.20251001",
    "h5py-stubs>=0.1.2",
    "types-PyYAML>=6.0.12.20250402",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-autorefs>=1.2.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]
gello = [
    "dm-control>=1.0.39",
    "mujoco>=3.7.0",
    "numpy>=2.2.6",
    "tyro>=1.0.13",
    "zmq>=0.0.0",
]
spacemouse = ["pyspacemouse>=0.0.7"]
realsense = ["pyrealsense2>=2.54.2"] # RealSense用（現状 Linux で主に利用）
audio = ["pyaudio>=0.2.14"]


[project.scripts]
robopy-viewer = "robopy.viewer.__main__:main"
robopy-vr = "robopy.vr.__main__:main"
robopy-vr-render = "robopy.vr.render:main"
robopy-models = "robopy.models:main"
robopy-rakuda-mjcf = "robopy.sim.mjcf_export:main"

# MetaSim (RoboVerse) discovers content packs through this entry point group and
# gives them precedence over its own bundled pack.  Declaring it means that
# installing robopy is all it takes for `get_robot("rakuda")` and the
# `rakuda.*` tasks to resolve -- the RoboVerse checkout needs no edits.
# MetaSim appends the role to this root, i.e. it imports
# `robopy.roboverse.robots`, `robopy.roboverse.tasks`, and so on.
[project.entry-points."metasim.packages"]
robopy = "robopy.roboverse"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv_build]
package = true

[tool.uv.build-backend]
# The Rakuda visual meshes (53 MB, Git LFS) are fetched on demand with
# `robopy-models fetch`; the URDFs and convex hulls ship in the wheel.
wheel-exclude = ["robopy/models/rakuda/assembly_2/meshes/**"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]

[tool.ruff]
line-length = 100
include = ["pyproject.toml", "src/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "I"]
ignore = [
    "CPY",
    "D100",
    "D107",
    "T201",
    "D400",
    "D415",
    "INP001",
    "ERA001",
    "RET504",
]
fixable = ["ALL"]
unfixable = []
exclude = [".git", ".ruff_cache", ".venv"]
