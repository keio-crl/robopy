name: Release visual meshes

# Builds rakuda_visual_meshes.zip from the Git LFS content and attaches it to
# the GitHub Release of the pushed tag. An installed robopy downloads that
# asset with `robopy-models fetch` (see src/robopy/models/__init__.py, which
# pins the default tag in RAKUDA_VISUAL_MESH_RELEASE_TAG).
#
#   git tag rakuda-visual-meshes-v1 && git push origin rakuda-visual-meshes-v1

on:
  push:
    tags:
      - "rakuda-visual-meshes-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach the asset to"
        required: true

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build the asset
        run: uv run python scripts/build_visual_mesh_asset.py --out dist/rakuda_visual_meshes.zip

      - name: Create or update the release and attach the asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/rakuda_visual_meshes.zip --clobber
          else
            gh release create "$TAG" dist/rakuda_visual_meshes.zip \
              --title "Rakuda visual meshes ($TAG)" \
              --notes "Visual STL meshes of the Rakuda-2 export for \`robopy-models fetch\`. Not part of the wheel; the URDFs and convex hulls are."
          fi
