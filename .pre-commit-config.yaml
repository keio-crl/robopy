repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        # The packaged Rakuda model is 2.8 MB: a single MJCF with the convex
        # hulls inlined, so that `pip install robopy` alone is enough to put the
        # robot in a RoboVerse scene (a wheel cannot reach models/).
        # See docs/robots/rakuda_roboverse.md.
        args: [--maxkb=3000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
            - types-requests
            - numpy
            - types-PyYAML
