name: Hardware-free tests

# Builds the optional C++ transport and runs the tests that need no hardware:
# the Dynamixel transports (driven against a protocol 2.0 simulator on a pty,
# with and without the native backend) and the camera frame dtype contract.

on:
  push:
    branches:
      - master
      - main
    paths:
      - "native/**"
      - "src/robopy/motor/**"
      - "src/robopy/robots/rakuda/**"
      - "src/robopy/sensors/visual/**"
      - "src/robopy/utils/h5_handler.py"
      - "src/robopy/utils/worker/**"
      - "tests/support/**"
      - "tests/test_dynamixel_bus.py"
      - "tests/test_rakuda_dynamixel_integration.py"
      - "tests/test_camera_frames.py"
      - ".github/workflows/hardware-free-tests.yml"
  pull_request:
    paths:
      - "native/**"
      - "src/robopy/motor/**"
      - "src/robopy/robots/rakuda/**"
      - "src/robopy/sensors/visual/**"
      - "src/robopy/utils/h5_handler.py"
      - "src/robopy/utils/worker/**"
      - "tests/support/**"
      - "tests/test_dynamixel_bus.py"
      - "tests/test_rakuda_dynamixel_integration.py"
      - "tests/test_camera_frames.py"
      - ".github/workflows/hardware-free-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run the camera frame tests
        run: uv run pytest tests/test_camera_frames.py -q

      - name: Run the transport tests on the pure-Python backend
        run: uv run pytest tests/test_dynamixel_bus.py tests/test_rakuda_dynamixel_integration.py -q

      - name: Build the C++ transport
        run: uv pip install ./native/robopy_dxl

      - name: Run the transport tests on both backends
        run: uv run pytest tests/test_dynamixel_bus.py tests/test_rakuda_dynamixel_integration.py -q

      - name: Smoke-test the benchmark
        run: uv run python scripts/bench_dynamixel.py --motors 8 --iterations 50
